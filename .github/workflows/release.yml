name: Release

permissions:
  contents: write

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+*'

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libavcodec-dev libavformat-dev libavutil-dev libswscale-dev libswresample-dev libavfilter-dev libavdevice-dev libudev-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build release binary
        run: cargo build --release

      - name: Package artifacts
        run: |
          mkdir -p dist
          cp target/release/ascii dist/
          tar -czf "ascii-${{ github.ref_name }}-x86_64-linux.tar.gz" -C dist ascii
          sha256sum "ascii-${{ github.ref_name }}-x86_64-linux.tar.gz" > "ascii-${{ github.ref_name }}-x86_64-linux.tar.gz.sha256"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "ascii ${{ github.ref_name }}" \
            --generate-notes \
            "ascii-${{ github.ref_name }}-x86_64-linux.tar.gz" \
            "ascii-${{ github.ref_name }}-x86_64-linux.tar.gz.sha256"