[package]
name = "ascii"
version = "1.2.1"
edition = "2021"
description = "Fast and simple ASCII art generator. Supports many image formats."
repository = "https://github.com/eRgo35/ascii"
readme = "README.md"

[profile.release]
lto = "thin"
strip = true

[dependencies]
clap = { version = "4.6", features = ["derive"] }
clearscreen = "4.0"
colored = "3.1"
ffmpeg-next = "9.0.0"
image = "0.25"
nokhwa = { version = "0.10.11", features = ["input-native"] }
